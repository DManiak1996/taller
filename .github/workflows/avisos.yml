# Avisos del taller. Este repositorio es público: el script nunca imprime datos, solo «ok».
# Quien lo lanza a su hora es Supabase (pg_cron, ver supabase/avisos.sql), con workflow_dispatch: los horarios de
# GitHub llegan con horas de retraso o no llegan. Los de aquí abajo quedan de respaldo. El script mira la hora
# de Madrid y no avisa dos veces el mismo día, así que da igual cuántas veces se lance.
name: Avisos

on:
  schedule:
    - cron: '17 18,19,20 * * *' # respaldo del aviso de las 20:00 (Madrid), solo si hoy no hay reto hecho
    - cron: '23 18,19,20 * * 0' # respaldo del resumen del domingo 19:00 (Madrid) en el repo misiones
  workflow_dispatch:
    inputs:
      modo:
        description: recordatorio o resumen
        type: choice
        options: [recordatorio, resumen]
        default: recordatorio
      semana:
        description: 'Solo para el resumen de una semana ya pasada, por ejemplo 2026-S44 (vacío: la última)'
        required: false
        default: ''

concurrency:
  group: avisos
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para mantener activo este workflow programado

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar web-push (solo eso, aparte del resto del proyecto)
        run: mkdir -p /tmp/avisos && cp scripts/avisos.mjs /tmp/avisos/ && cd /tmp/avisos && npm init -y > /dev/null && npm install web-push@3.6.7 > /dev/null
      - name: Aviso o resumen
        env:
          TALLER_CLAVE: ${{ secrets.TALLER_CLAVE }}
          MISIONES_TOKEN: ${{ secrets.MISIONES_TOKEN }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || (github.event.schedule == '23 18,19,20 * * 0' && 'resumen' || 'recordatorio') }}
          SEMANA: ${{ github.event_name == 'workflow_dispatch' && inputs.semana || '' }}
        run: node /tmp/avisos/avisos.mjs "$MODO" "$SEMANA"
      - name: Mantener activo el workflow
        # GitHub apaga los workflows programados tras 60 días sin actividad en el repositorio.
        if: github.event.schedule == '23 18,19,20 * * 0' || inputs.modo == 'resumen'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable" > /dev/null && echo ok
